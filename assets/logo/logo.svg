<svg id="lm-logo" viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lm-logo-title">
  <title id="lm-logo-title">Lumen Metrics — Metrology to Life</title>

  <defs>
    <linearGradient id="lm-grad-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab4ff"/>
      <stop offset="45%" stop-color="#b56ce8"/>
      <stop offset="100%" stop-color="#7a3fc9"/>
    </linearGradient>

    <linearGradient id="lm-grad-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8fd6"/>
      <stop offset="50%" stop-color="#d13fb0"/>
      <stop offset="100%" stop-color="#8f2588"/>
    </linearGradient>

    <linearGradient id="lm-grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd28a"/>
      <stop offset="45%" stop-color="#f7943f"/>
      <stop offset="100%" stop-color="#c2500f"/>
    </linearGradient>

    <radialGradient id="lm-grad-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#bfefff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#bfefff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lm-grad-ground" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lm-grad-wordmark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8c0cc"/>
    </linearGradient>

    <filter id="lm-blur-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="lm-blur-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <filter id="lm-blur-wide" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- ============ GROUND SHADOW (grounds the prism) ============ -->
  <g id="lm-logo-ground-shadow">
    <ellipse cx="430" cy="452" rx="230" ry="16" fill="url(#lm-grad-ground)"/>
  </g>

  <!-- ============ CORE GLOW (behind prism, light source point) ============ -->
  <g id="lm-logo-core-glow">
    <circle cx="430" cy="290" r="150" fill="url(#lm-grad-core)" filter="url(#lm-blur-wide)"/>
  </g>

  <!-- ============ SPECTRUM RAYS (emerge right from prism) ============ -->
  <g id="lm-logo-rays" stroke-linecap="round">
    <!-- glow pass -->
    <g id="lm-logo-rays-glow" filter="url(#lm-blur-glow)" opacity="0.5">
      <line x1="430" y1="290" x2="850" y2="155" stroke="#ff4d4d" stroke-width="9"/>
      <line x1="430" y1="290" x2="862" y2="200" stroke="#ff9f43" stroke-width="8"/>
      <line x1="430" y1="290" x2="870" y2="245" stroke="#ffe14d" stroke-width="7"/>
      <line x1="430" y1="290" x2="874" y2="290" stroke="#4dff9f" stroke-width="8"/>
      <line x1="430" y1="290" x2="868" y2="335" stroke="#4dd7ff" stroke-width="7"/>
      <line x1="430" y1="290" x2="856" y2="378" stroke="#5f7bff" stroke-width="8"/>
      <line x1="430" y1="290" x2="836" y2="418" stroke="#b45fff" stroke-width="9"/>
    </g>
    <!-- crisp pass -->
    <g id="lm-logo-rays-core" opacity="0.92">
      <line x1="430" y1="290" x2="850" y2="155" stroke="#ff5c5c" stroke-width="3"/>
      <line x1="430" y1="290" x2="862" y2="200" stroke="#ffab5c" stroke-width="2.6"/>
      <line x1="430" y1="290" x2="870" y2="245" stroke="#ffe75c" stroke-width="2.2"/>
      <line x1="430" y1="290" x2="874" y2="290" stroke="#5cffab" stroke-width="2.6"/>
      <line x1="430" y1="290" x2="868" y2="335" stroke="#5ce1ff" stroke-width="2.2"/>
      <line x1="430" y1="290" x2="856" y2="378" stroke="#7c8fff" stroke-width="2.6"/>
      <line x1="430" y1="290" x2="836" y2="418" stroke="#c98cff" stroke-width="3"/>
    </g>
    <!-- incoming white light beam (from left, into prism) -->
    <g id="lm-logo-ray-incoming">
      <line x1="30" y1="290" x2="430" y2="290" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
      <line x1="30" y1="290" x2="430" y2="290" stroke="#ffffff" stroke-width="14" opacity="0.22" filter="url(#lm-blur-soft)"/>
    </g>
  </g>

  <!-- ============ MEASUREMENT SCALE (arc + ticks, upper right of prism) ============ -->
  <g id="lm-logo-scale" stroke="#dbe2ee" fill="none" opacity="0.95">
    <path id="lm-logo-scale-arc" d="M 545 150 A 130 130 0 0 1 630 265" stroke-width="3" stroke-linecap="round"/>
    <g id="lm-logo-scale-ticks" stroke-width="3" stroke-linecap="round">
      <line x1="545" y1="150" x2="530" y2="134"/>
      <line x1="573" y1="138" x2="562" y2="120"/>
      <line x1="602" y1="140" x2="595" y2="121"/>
      <line x1="627" y1="152" x2="623" y2="132"/>
      <line x1="630" y1="265" x2="649" y2="270"/>
    </g>
  </g>

  <!-- ============ PRISM ============ -->
  <g id="lm-logo-prism">
    <!-- left face: violet/magenta -->
    <g id="lm-logo-prism-face-left">
      <polygon points="430,120 230,440 430,440" fill="url(#lm-grad-violet)"/>
      <polygon points="430,120 230,440 430,440" fill="url(#lm-grad-magenta)" opacity="0.32"/>
    </g>

    <!-- right face: amber/orange -->
    <g id="lm-logo-prism-face-right">
      <polygon points="430,120 430,440 610,440" fill="url(#lm-grad-amber)"/>
    </g>

    <!-- inner facet line (glass edge) -->
    <g id="lm-logo-prism-edges" stroke="#ffffff" stroke-linecap="round" opacity="0.6">
      <line x1="430" y1="120" x2="430" y2="440" stroke-width="1.5"/>
      <line x1="230" y1="440" x2="430" y2="120" stroke-width="1.5" opacity="0.75"/>
      <line x1="610" y1="440" x2="430" y2="120" stroke-width="1.5" opacity="0.75"/>
    </g>

    <!-- glass highlight sliver on left face -->
    <polygon id="lm-logo-prism-highlight" points="392,175 430,120 430,300" fill="#ffffff" opacity="0.2"/>

    <!-- glass highlight sliver on right face -->
    <polygon id="lm-logo-prism-highlight-right" points="430,150 462,132 430,250" fill="#ffffff" opacity="0.14"/>

    <!-- base line -->
    <line x1="230" y1="440" x2="610" y2="440" stroke="#1a0f14" stroke-width="2" opacity="0.4"/>

    <!-- core sparkle at refraction point -->
    <circle id="lm-logo-prism-core" cx="430" cy="290" r="11" fill="#ffffff" opacity="0.92" filter="url(#lm-blur-soft)"/>
  </g>

  <!-- ============ WORDMARK ============ -->
  <g id="lm-logo-wordmark-group" text-anchor="middle">
    <text id="lm-logo-wordmark"
          x="430" y="650"
          font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif"
          font-weight="700"
          font-size="78"
          letter-spacing="7"
          fill="url(#lm-grad-wordmark)">LUMEN METRICS</text>

    <text id="lm-logo-tagline"
          x="430" y="690"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-weight="400"
          font-size="26"
          letter-spacing="9"
          fill="#4fd8e0">METROLOGY TO LIFE</text>
  </g>
</svg>
