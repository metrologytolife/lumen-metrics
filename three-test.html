<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js Lesson 5</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05070d; }
  canvas { display: block; }
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.z = 5;
camera.position.y = 0.3;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
sunLight.position.set(-4, 2, 3);
scene.add(sunLight);

const ambient = new THREE.AmbientLight(0x404060, 0.6);
scene.add(ambient);

const geometry = new THREE.ConeGeometry(1.3, 2, 3);

const posAttr = geometry.attributes.position;
const colors = [];
const violet = new THREE.Color(0x9b5de5);
const amber = new THREE.Color(0xf7943f);

for (let i = 0; i < posAttr.count; i++) {
  const x = posAttr.getX(i);
  const t = THREE.MathUtils.clamp((x + 1.3) / 2.6, 0, 1);
  const vertexColor = violet.clone().lerp(amber, t);
  colors.push(vertexColor.r, vertexColor.g, vertexColor.b);
}
geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

const material = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  vertexColors: true,
  transmission: 1.0,
  roughness: 0.05,
  ior: 1.6,
  thickness: 1.5,
  clearcoat: 1.0,
  clearcoatRoughness: 0.1,
});

const prism = new THREE.Mesh(geometry, material);
prism.rotation.y = Math.PI / 6;
scene.add(prism);

// ============ NEW: a small bright "core" sphere, to give bloom something to bloom ============
const coreGeometry = new THREE.SphereGeometry(0.12, 16, 16);
const coreMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff }); // unlit, pure bright color
const core = new THREE.Mesh(coreGeometry, coreMaterial);
core.position.set(0, 0, 0.3); // sits at the prism's refraction point
scene.add(core);

// ============ NEW: POST-PROCESSING CHAIN ============
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera)); // step 1: normal render

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.9,   // strength
  0.6,   // radius
  0.75   // threshold — only things brighter than this bloom
);
composer.addPass(bloomPass); // step 2: bloom the bright parts

composer.addPass(new OutputPass()); // step 3: correct color output after post-processing

function animate() {
  requestAnimationFrame(animate);
  prism.rotation.y += 0.005;
  composer.render(); // NOTE: composer.render() replaces renderer.render()
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
