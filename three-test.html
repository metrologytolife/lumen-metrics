<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js Lesson 2</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05070d; }
  canvas { display: block; }
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.z = 5;
camera.position.y = 0.3; // slight downward angle onto the prism, like your reference

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ============ THE PRISM GEOMETRY ============
// ConeGeometry(radiusAtBase, height, radialSegments)
// radialSegments = 3 turns the "cone" into a 3-sided pyramid
const geometry = new THREE.ConeGeometry(1.3, 2, 3);

const material = new THREE.MeshNormalMaterial();
const prism = new THREE.Mesh(geometry, material);

// A ConeGeometry's flat side faces straight at the camera by default.
// We rotate it so an EDGE faces the camera instead — that's what reveals
// two distinct lit faces (left + right), matching your reference image.
prism.rotation.y = Math.PI / 6; // 30 degrees

scene.add(prism);

function animate() {
  requestAnimationFrame(animate);
  // slow auto-rotate so you can inspect the shape from all angles for now
  // (we'll remove this once we lock the final camera angle)
  prism.rotation.y += 0.005;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
