<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js Lesson 4</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05070d; }
  canvas { display: block; }
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.z = 5;
camera.position.y = 0.3;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
sunLight.position.set(-4, 2, 3);
scene.add(sunLight);

const ambient = new THREE.AmbientLight(0x404060, 0.6);
scene.add(ambient);

// ============ PRISM GEOMETRY ============
const geometry = new THREE.ConeGeometry(1.3, 2, 3);

// ============ NEW: PER-VERTEX COLOR (left = violet, right = amber) ============
const posAttr = geometry.attributes.position;
const colors = [];
const violet = new THREE.Color(0x9b5de5);
const amber = new THREE.Color(0xf7943f);

for (let i = 0; i < posAttr.count; i++) {
  const x = posAttr.getX(i);                          // this vertex's left/right position
  const t = THREE.MathUtils.clamp((x + 1.3) / 2.6, 0, 1); // map x range to 0-1
  const vertexColor = violet.clone().lerp(amber, t);   // blend violet -> amber
  colors.push(vertexColor.r, vertexColor.g, vertexColor.b);
}
geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

// ============ MATERIAL — now reads vertex colors ============
const material = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,        // white base so vertex colors aren't further tinted
  vertexColors: true,     // NEW — tells the material to use the per-vertex colors above
  transmission: 1.0,
  roughness: 0.05,
  ior: 1.6,
  thickness: 1.5,
  clearcoat: 1.0,
  clearcoatRoughness: 0.1,
});

const prism = new THREE.Mesh(geometry, material);
prism.rotation.y = Math.PI / 6;
scene.add(prism);

function animate() {
  requestAnimationFrame(animate);
  prism.rotation.y += 0.005;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
